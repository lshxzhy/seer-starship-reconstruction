<div id="seer-starship-3d">
  <div class="seer-stage">
    <canvas tabindex="0" role="img" aria-label="赛尔号飞船模拟器。点击画面后用 WASD 移动或驾驶，M 打开地图和航线，B 打开舰内背包。">需要 WebGL 才能显示三维模型。</canvas>
    <header class="ship-ident">
      <span class="ship-insignia" aria-hidden="true"></span>
      <div><small>SEER <span>／ SE–A015</span></small><strong data-tag>传送舱</strong></div>
    </header>
    <div class="ship-telemetry"><i aria-hidden="true"></i><span data-status>玩家 SE-00001</span></div>
    <div class="ship-route">
      <div class="ship-route-hint" data-route-hint hidden></div>
      <button type="button" class="ship-key route-cancel" data-route-cancel hidden>取消路线 · Esc</button>
    </div>
    <div class="ship-car-display" data-lift-readout hidden><span data-car-message></span><span data-car-height></span><progress data-car-progress max="1" value="0" aria-label="升降行程"></progress></div>
    <div class="ship-actions">
      <button type="button" class="ship-key" data-embark hidden>乘廊车去登陆艇</button>
      <button type="button" class="ship-key" data-duty-contact hidden></button>
      <button type="button" class="ship-key" data-see-pipi hidden>观察皮皮</button>
      <button type="button" class="ship-key" data-encounter hidden>接触精灵</button>
      <button type="button" class="ship-key" data-wetland-action hidden>捕猎场</button>
      <button type="button" class="ship-key" data-exchange hidden>能源兑换台</button>
      <button type="button" class="ship-key" data-bench hidden>领取挖矿钻头</button>
      <button type="button" class="ship-key" data-lift-call hidden>呼叫轿厢</button>
      <label class="ship-key" data-lift-control hidden>轿厢选层 <select aria-label="选择停靠甲板" data-lift></select></label>
      <button type="button" class="ship-key" data-flyer hidden>驾驶滑翔翼</button>
      <button type="button" class="ship-key" data-climb hidden>升高</button>
      <button type="button" class="ship-key" data-descend hidden>降低</button>
    </div>
    <div class="seer-motion" data-move-pad role="group" aria-label="移动" hidden>
      <button type="button" data-step="KeyW" aria-label="前进">↑</button>
      <button type="button" data-step="KeyA" aria-label="向左平移">←</button>
      <button type="button" data-step="KeyS" aria-label="后退">↓</button>
      <button type="button" data-step="KeyD" aria-label="向右平移">→</button>
    </div>
    <nav class="ship-dock" aria-label="赛尔导航条">
      <button type="button" data-console="map" aria-label="地图（M）"><i class="dock-radar" aria-hidden="true"></i><span>地图</span><kbd>M</kbd></button>
      <button type="button" data-console="bag" aria-label="背包（B）"><i class="dock-case" aria-hidden="true"></i><span>背包</span><kbd>B</kbd></button>
      <button type="button" data-spirit-book><i class="dock-capsule" aria-hidden="true"></i><span>精灵</span></button>
      <button type="button" data-console="terminal"><i class="dock-terminal" aria-hidden="true"></i><span>终端</span></button>
    </nav>
    <nav class="ship-dock planetary-dock" data-planet-nav aria-label="行星导航" hidden>
      <button type="button" data-atlas><i class="dock-radar" aria-hidden="true"></i><span>地表图</span><kbd>M</kbd></button>
      <button type="button" data-spirit-book><i class="dock-capsule" aria-hidden="true"></i><span>精灵</span></button>
      <button type="button" data-land hidden>操作驾驶席</button>
      <button type="button" data-return hidden>自动航行</button>
      <button type="button" data-flight-view hidden>舷外视角</button>
    </nav>
    <div class="ship-overlay" data-planet-atlas hidden>
      <section class="ship-window planet-atlas" role="dialog" aria-modal="true" aria-labelledby="planet-chart-title">
        <header class="console-head"><div><small>帕诺星系 ／ L-01</small><h2 id="planet-chart-title">登陆艇航线</h2></div><button type="button" class="ship-dismiss" data-chart-close aria-label="关闭航线">×</button></header>
        <div class="atlas-body"><svg data-site-map role="img" aria-label="行星导航图"></svg>
        <section class="atlas-controls"><label>目的地 <select data-site-select></select></label><p data-site-summary></p>
          <div class="atlas-actions"><button class="ship-key" type="button" data-track-site>自动飞往此处</button><button class="ship-key" type="button" data-target-only>设为手动航点</button><button class="ship-key" type="button" data-unseat hidden>离开驾驶席</button></div></section></div>
      </section>
    </div>
    <div class="shuttle-hand" data-shuttle-hand hidden aria-label="登陆艇飞行操纵">
      <button type="button" data-flight-key="ArrowUp" title="方向键 ↑">抬头 ↑</button><button type="button" data-flight-key="ArrowDown" title="方向键 ↓">低头 ↓</button>
      <button type="button" data-flight-key="Space">升 · 空格</button><button type="button" data-flight-key="KeyC">降 · C</button>
      <button type="button" data-flight-key="ShiftLeft">加力 · Shift</button><button type="button" data-flight-key="KeyX">制动 · X</button>
      <button type="button" data-flight-center>正视 · H</button><button type="button" data-flight-unseat>离席 · J</button>
    </div>
    <div class="ship-notice" data-notice role="status" hidden></div>
    <div class="ship-overlay spirit-overlay" data-spirit-overlay hidden>
      <section class="ship-window spirit-panel" role="dialog" aria-modal="true" aria-labelledby="spirit-window-title">
        <header class="console-head"><div><small>SE–A015 ／ 精灵终端</small><h2 id="spirit-window-title">精灵背包</h2></div><button class="ship-dismiss" type="button" data-spirit-close aria-label="收起精灵终端">×</button></header>
        <nav class="spirit-tabs" data-spirit-tabs aria-label="精灵终端栏目"></nav>
        <div class="spirit-scroll" data-spirit-content></div>
        <p class="spirit-feedback" role="status" data-spirit-feedback hidden></p>
      </section>
    </div>
    <div class="ship-overlay" data-overlay hidden>
      <section class="ship-window" role="dialog" aria-modal="true" aria-labelledby="ship-panel-title">
        <header class="console-head"><div><small>SE–A015</small><h2 id="ship-panel-title" data-panel-title></h2></div><button type="button" class="ship-dismiss" data-dismiss aria-label="关闭窗口">×</button></header>
        <div data-page="map" hidden><div data-navigation-map></div>
          <div class="ship-row map-field-tools" data-field-tools hidden>
            <button class="ship-key" type="button" data-twin-horizon hidden>望向伴星</button>
            <label>面屏表情 <select data-face-expression="planet"></select></label>
          </div>
        </div>
        <div data-page="bag" hidden></div>
        <div data-page="exchange" hidden></div>
        <section data-page="crew" class="ship-systems" hidden>
          <h3 data-duty-post></h3><ul data-duty-facts></ul>
          <button type="button" data-duty-chat hidden>开启本机通讯</button>
        </section>
        <div data-page="terminal" class="ship-systems" hidden>
          <section data-boarding-controls><h3>赛尔操控</h3><div class="ship-row">
            <label>镜头 <select data-perspective><option value="follow">跟随</option><option value="eye">第一人称</option></select></label>
            <button type="button" data-face-player>看正面</button><label>面屏表情 <select data-face-expression="ship"></select></label><button type="button" data-nono>招呼超能 NoNo</button>
            <label data-berth-picker hidden>登乘机位 <select data-berth-select></select></label>
            <label data-berth-route-picker hidden>目的地 <select data-berth-route></select></label>
            <button type="button" data-inspect-workstation hidden>近看设备</button><button type="button" data-comms>舰上通讯</button>
          </div><h3 class="ship-job-title">动力室物资交接</h3><p class="ship-job-record" data-delivery-record></p>
          <button type="button" data-delivery-track>引导至机械室矿架</button></section>
          <section><h3>舰体观察</h3><div class="ship-row">
            <button type="button" data-view="board" aria-pressed="true">登舰</button><button type="button" data-view="exterior" aria-pressed="false">外观</button><button type="button" data-view="section" aria-pressed="false">纵剖</button><button type="button" data-view="deck" aria-pressed="false">分层</button><button type="button" data-locate-room hidden>全舰定位</button>
            <button type="button" data-action="rotate" hidden>自动旋转</button><button type="button" data-action="wire" hidden>线框</button><button type="button" data-action="fullscreen" hidden>全屏</button>
          </div><div class="seer-pickers ship-row" hidden><label>层区 <select data-deck></select></label><label>舱室 <select data-room></select></label><button type="button" data-enter-room hidden>进入此舱</button></div></section>
          <section class="ship-log"><h3>航行记录</h3><p data-detail></p><p data-population hidden></p><p data-controls-hint></p></section>
          <small class="ship-credits">非官方同人三维复原。原创程序与文档采用 MIT 许可，原作名称、角色形象及游戏美术归相应权利人。</small>
        </div>
      </section>
    </div>
    <p class="seer-error" role="alert" hidden></p>
  </div>
</div>
