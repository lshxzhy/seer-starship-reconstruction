<div id="seer-starship-3d">
  <div class="seer-heading">
    <div><h2>SEER</h2><span class="text-small text-muted">SE–A015 扩建方案 · 舰长 795 米</span></div>
    <div class="viz-controls">
      <button class="btn" type="button" data-action="rotate" aria-pressed="false" hidden>自动旋转</button>
      <button class="btn" type="button" data-action="wire" aria-pressed="false" hidden>线框</button>
      <button class="btn" type="button" data-action="fullscreen" aria-pressed="false" hidden>全屏</button>
    </div>
  </div>
  <div class="seer-toolbar">
    <div class="viz-row" role="group" aria-label="查看方式">
      <button type="button" class="btn" data-view="board" aria-pressed="true">登舰</button>
      <button type="button" class="btn" data-view="exterior" aria-pressed="false">外观</button>
      <button type="button" class="btn" data-view="section" aria-pressed="false">纵剖</button>
      <button type="button" class="btn" data-view="deck" aria-pressed="false">分层</button>
    </div>
    <div class="seer-pickers" hidden>
      <label>层区 <select class="form-select" data-deck></select></label>
      <label>舱室 <select class="form-select" data-room></select></label>
      <button type="button" class="btn" data-enter-room hidden>进入此舱</button>
    </div>
    <div class="seer-pickers seer-boarding" data-boarding-controls>
      <label>目的地 <select class="form-select" data-jump-room></select></label>
      <label>视角 <select class="form-select" data-perspective><option value="follow">跟随赛尔</option><option value="eye">第一人称</option></select></label>
      <button type="button" class="btn" data-face-player>看正面</button>
      <button type="button" class="btn" data-smile aria-pressed="false">微笑</button>
      <button type="button" class="btn" data-nono>招呼超能 NoNo</button>
      <button type="button" class="btn" data-flyer>驾驶滑翔翼</button>
      <button type="button" class="btn" data-climb hidden>升高</button>
      <button type="button" class="btn" data-descend hidden>降低</button>
      <button type="button" class="btn" data-inspect-workstation hidden>近看设备</button>
      <button type="button" class="btn" data-locate-room>全舰定位</button>
      <label data-lift-control hidden>乘电梯 <select class="form-select" data-lift></select></label>
    </div>
  </div>
  <div class="seer-stage">
    <canvas role="img" aria-label="点一下画面，用 WASD 或屏幕方向键移动。Shift 加速，拖动环视，V 切换视角。F 登乘或着陆，空格上升，C 下降。">需要 WebGL 才能显示三维模型。</canvas>
    <span class="seer-tag" data-tag hidden></span>
    <div class="seer-motion" data-move-pad role="group" aria-label="按住移动" hidden>
      <button class="btn" type="button" data-step="KeyW" aria-label="前进">↑</button>
      <button class="btn" type="button" data-step="KeyA" aria-label="向左平移">←</button>
      <button class="btn" type="button" data-step="KeyS" aria-label="后退">↓</button>
      <button class="btn" type="button" data-step="KeyD" aria-label="向右平移">→</button>
    </div>
    <p class="seer-error" role="alert" hidden></p>
  </div>
  <p class="seer-detail" data-detail aria-live="polite"></p>
  <div class="seer-footer text-small text-muted"><span data-controls-hint>拖动转头 · W/A/S/D 移动 · Shift 快行</span><span data-status></span></div>
  <p class="seer-manifest text-small text-muted" data-population hidden></p>
  <p class="seer-manifest text-small text-muted">非官方同人三维复原。项目原创程序和文档采用 MIT 许可，原作名称、角色形象及游戏美术归相应权利人。</p>
</div>
<style>
  #seer-starship-3d { width:100%; color:var(--foreground) }
  #seer-starship-3d .seer-heading,#seer-starship-3d .seer-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.65em }
  #seer-starship-3d .seer-heading { margin-bottom:.6em; padding-right:86px }
  #seer-starship-3d .seer-stage { position:relative; width:100%; height:clamp(350px,68vw,550px); overflow:hidden; background:radial-gradient(ellipse at 82% 88%,#292739 0%,transparent 53%),radial-gradient(ellipse at 14% 32%,#1a394e 0%,transparent 58%),linear-gradient(135deg,#080f21,#10162c 65%,#0c1321) }
  #seer-starship-3d canvas {display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #seer-starship-3d canvas:active {cursor:grabbing}
  #seer-starship-3d .seer-footer { margin-top:.5em }
  #seer-starship-3d .seer-manifest {margin:.3em 0 0}
  #seer-starship-3d .seer-toolbar,#seer-starship-3d .seer-pickers,#seer-starship-3d .seer-pickers label {display:flex;flex-wrap:wrap;align-items:center;gap:.55em}
  #seer-starship-3d .seer-toolbar {margin:.6em 0}
  #seer-starship-3d .seer-pickers select {width:auto;max-width:100%}
  #seer-starship-3d .seer-motion {position:absolute;left:.7em;bottom:.7em;display:grid;grid-template-columns:repeat(3,minmax(34px,auto));gap:.22em;touch-action:none;user-select:none}
  #seer-starship-3d [data-step="KeyW"] {grid-column:2}
  #seer-starship-3d [data-step="KeyA"] {grid-column:1}
  @media(pointer:coarse) { #seer-starship-3d .seer-motion {grid-template-columns:repeat(3,minmax(44px,auto));grid-auto-rows:minmax(44px,auto)} }
  #seer-starship-3d [hidden] {display:none!important}
  #seer-starship-3d .seer-detail {margin:.55em 0 0}
  #seer-starship-3d:fullscreen {display:flex;flex-direction:column;box-sizing:border-box;overflow:auto;padding:.75em;background:var(--background,#101723)}
  #seer-starship-3d:fullscreen .seer-stage {flex:1 1 auto;min-height:180px;height:auto}
  #seer-starship-3d .seer-tag {position:absolute;left:.85em;top:.85em;pointer-events:none;color:#fff;background:#12263ee8;padding:.20em .55em;border-radius:.35em}
  #seer-starship-3d .seer-error { position:absolute; inset:40% 10% auto; color:#fff }
  @media(max-width:480px) { #seer-starship-3d .seer-heading {padding-right:0;padding-top:1.8em} }
</style>
